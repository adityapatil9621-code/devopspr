---
- name: Install and Configure Apache
  hosts: webservers
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install packages
      apt:
        name:
          - apache2
          - curl
          - git
          - vim
        state: present

    - name: Start Apache service
      service:
        name: apache2
        state: started
        enabled: yes

   - name: Copy custom index.html
      copy:
        content: |
          <html>
          <head><title>Ansible Practical</title></head>
          <body>
          <h1>Apache Server Configured by Ansible</h1>
          <p>Managed Node is Working Successfully!</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'
